/**/udp_bridge:
  ros__parameters:
    name: operator
    maximum_packet_size: 1000
    remotes_list:
      - bizzy
    remotes:
      bizzy:
        connections_list:
          - wifi
          - vpn
        connections:
          wifi:
            host: gabby.bizzy.p11.lan
            port: 4200
            return_host: salmon.op.p11.lan
            return_port: 4200
            topics_list:
            - command
            - joystick_helm
            topics:
              command: {source: /bizzy/marine/command}
              joystick_helm: {source: /bizzy/piloting_mode/manual/helm}

          vpn:
            host: gabby.vpn.bizzy.p11.lan
            port: 4200
            return_host: salmon.vpn.bizzy.p11.lan
            return_port: 4200
            topics_list:
            - command
            - joystick_helm
            topics:
              command: {source: /bizzy/marine/command}
              joystick_helm: {source: /bizzy/piloting_mode/manual/helm}
