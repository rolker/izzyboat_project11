/**/udp_bridge:
  ros__parameters:
    # NOTE: return_host is deliberately absent from this file. It is derived
    # from the operator station's hostname by operator_core_launch.py
    # (<host>.op / <host>.vpn.bizzy / <host>.cell.bizzy, per dns_naming.md
    # rule 8) so one config serves every operator station. Override with the
    # return_host_prefix launch argument.
    #
    # It must never be left empty: udp_bridge only re-points an *existing*
    # boat-side connection when return_host is non-empty (remote_node.cpp:74-80).
    # The learned-source-address fallback applies at connection creation only,
    # so an empty value lets a boat that has been up since the previous
    # station's session keep transmitting there, silently.
    name: operator
    maximum_packet_size: 1000
    remotes_list:
      - bizzy
    remotes:
      bizzy:
        connections_list:
          - wifi
          - vpn
          - cell
        connections:
          wifi:
            host: gabby.bizzy.p11.lan
            port: 4200
            return_port: 4200
            topics_list:
            - command
            - joystick_helm
            topics:
              command: {source: /bizzy/marine/command}
              joystick_helm: {source: /bizzy/piloting_mode/manual/helm}

          vpn:
            host: gabby.vpn.bizzy.p11.lan
            port: 4200
            return_port: 4200
            topics_list:
            - command
            - joystick_helm
            # Inbound to boat: CAMP's CUBE tile requests -> bizzy CUBE (camp
            # live-tile view, set up live 2026-06-29). Pairs with the outbound
            # coverage_catalog/coverage_tiles in bizzyboat.yaml's operator/vpn
            # connection. vpn only (not safety-critical; control topics above
            # stay redundant across wifi/vpn/cell, requests don't need to).
            - coverage_requests
            topics:
              command: {source: /bizzy/marine/command}
              joystick_helm: {source: /bizzy/piloting_mode/manual/helm}
              coverage_requests: {source: /bizzy/sensors/m3/cube_bathymetry/coverage_requests, queue_size: 10}

          # Redundant cell-VPN path (#145): same safety-critical uplink as
          # wifi/vpn, carried concurrently over the cell tunnel. Names resolve to
          # the cell NETMAP ranges (gabby.cell -> .23.5, salmon.cell -> .24.142).
          cell:
            host: gabby.cell.bizzy.p11.lan
            port: 4200
            return_port: 4200
            topics_list:
            - command
            - joystick_helm
            topics:
              command: {source: /bizzy/marine/command}
              joystick_helm: {source: /bizzy/piloting_mode/manual/helm}
