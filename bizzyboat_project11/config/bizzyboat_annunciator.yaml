diagnostics_topic: /diagnostics
indicators:
  # --- Link Quality ---
  - name: WiFi Bridge
    source: diagnostics
    diagnostic_name: "MikroTik: wifi.bizzy: wireless/"
    format: "{}"
    stale_timeout: 15.0

  - name: Cell Signal
    source: diagnostics
    diagnostic_name: "Teltonika: router.bizzy: cellular"
    format: "{}"
    stale_timeout: 15.0

  - name: Starlink
    source: diagnostics
    diagnostic_name: "Starlink: starlink.bizzy"
    format: "{}"
    stale_timeout: 5.0

  - name: UDP WiFi
    source: diagnostics
    diagnostic_name: "udp_bridge operator: bizzy: wifi"
    format: "{}"
    stale_timeout: 5.0

  - name: UDP VPN
    source: diagnostics
    diagnostic_name: "udp_bridge operator: bizzy: vpn"
    format: "{}"
    stale_timeout: 5.0

  # --- Critical Systems ---
  - name: Battery
    source: diagnostics
    diagnostic_name: "mavros: Battery"
    value_key: Voltage
    format: "{:.2f} V"
    thresholds:
      warn: "value < 23.0"
      error: "value < 21.5"

  - name: GPS
    source: diagnostics
    diagnostic_name: "mavros: GPS"
    format: "{}"

  - name: RTK
    source: diagnostics
    diagnostic_name: "GPS: RTK"
    format: "{}"

  - name: NTRIP
    source: diagnostics
    diagnostic_name: "NTRIP"
    format: "{}"
    stale_timeout: 10.0

  # Correction provenance: which base station and how far away. A liveness
  # check cannot see a caster left pointed at the wrong state (2026-08-21).
  - name: RTCM
    source: diagnostics
    diagnostic_name: "RTK: corrections"
    format: "{}"
    stale_timeout: 10.0

  # Ellipsoidal-height correction for the FCU fix. This node is IN the nav
  # position path -- mru_transform takes fcu.position from its output topic
  # (see the fcu block in bizzyboat.yaml) -- so if it stops, the position feed
  # stops and mru_transform fails over to the SBG, whose ~2 deg roll offset
  # tilts the costmap and produces aft false positives (bizzyboat.yaml:114).
  # That failover is silent everywhere else on this panel.
  - name: Ellipsoid
    source: diagnostics
    diagnostic_name: "GPS: ellipsoidal fix"
    format: "{}"
    stale_timeout: 10.0

  - name: FCU
    source: diagnostics
    diagnostic_name: "mavros: Heartbeat"
    format: "{}"

  - name: Comms
    source: diagnostics
    diagnostic_name: "Ping: ping.bizzy: salmon_direct"
    format: "{}"
    stale_timeout: 30.0

  - name: Nav Stack
    source: diagnostics
    diagnostic_name: "lifecycle_manager_navigation"
    format: "{}"
    stale_timeout: 10.0

  - name: Mission
    source: diagnostics
    diagnostic_name: "mission_manager"
    match_mode: substring
    format: "{}"
    stale_timeout: 5.0
