/**:
  ros__parameters:
    path: ""
    analyzers:
      boat:
        type: diagnostic_aggregator/AnalyzerGroup
        path: Boat
        analyzers:
          mavros:
            type: diagnostic_aggregator/GenericAnalyzer
            path: MAVROS
            startswith: ["mavros:"]
          mavros_router:
            type: diagnostic_aggregator/GenericAnalyzer
            path: MAVROS Router
            startswith: ["mavros_router:"]
          navigation:
            type: diagnostic_aggregator/GenericAnalyzer
            path: Navigation
            startswith: ["lifecycle_manager_navigation:"]
          mikrotik:
            type: diagnostic_aggregator/GenericAnalyzer
            path: MikroTik
            startswith: ["MikroTik: wifi.bizzy"]
          teltonika:
            type: diagnostic_aggregator/GenericAnalyzer
            path: Teltonika
            startswith: ["Teltonika: router.bizzy"]
          starlink:
            type: diagnostic_aggregator/GenericAnalyzer
            path: Starlink
            startswith: ["Starlink: starlink.bizzy"]
          ping:
            type: diagnostic_aggregator/GenericAnalyzer
            path: Ping
            contains: ["Ping:"]
      operator:
        type: diagnostic_aggregator/AnalyzerGroup
        path: Operator
        analyzers:
          mikrotik:
            type: diagnostic_aggregator/GenericAnalyzer
            path: MikroTik
            startswith: ["MikroTik: bizzy.wifi.op"]
          teltonika:
            type: diagnostic_aggregator/GenericAnalyzer
            path: Teltonika
            startswith: ["Teltonika: router.op"]
          starlink:
            type: diagnostic_aggregator/GenericAnalyzer
            path: Starlink
            startswith: ["Starlink: starlink.op"]
