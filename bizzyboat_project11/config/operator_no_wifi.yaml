# ROC / no-WiFi-bridge delta on top of operator.yaml.
#
# Loaded by operator_core_launch.py under `wifi:=false`, for operator stations
# with no line-of-sight RF path to the boat (e.g. the CCOM Telepresence Room,
# where the bridge radio is out of range). Over-the-horizon operation from
# anywhere is the same case.
#
# Shortening connections_list is the whole mechanism: udp_bridge iterates only
# the listed connections (udp_bridge.cpp:376-383), so the `wifi` block in
# operator.yaml is simply never read. Nothing is duplicated here — the topic
# lists, byte budgets and per-path tuning all stay in operator.yaml, so a topic
# added to the vpn or cell path is inherited automatically.
#
# The boat needs no matching change: its own `wifi` connection in
# bizzyboat.yaml carries no host and only learns one from an inbound packet,
# so it stays idle when nothing arrives over that path.
/**/udp_bridge:
  ros__parameters:
    remotes:
      bizzy:
        connections_list:
          - vpn
          # cell STOOD DOWN 2026-08-25 to match the boat side. There is no SIM
          # card in the boat's modem, so this connection never had an
          # independent path. Measured at Appledore: cell and vpn both resolve
          # to the same physical uplink (ip route get shows 192.168.24.144 and
          # 192.168.22.144 BOTH via 192.168.20.1 dev enp7s0), so cell traffic
          # was pure duplicate load competing with vpn on one pipe.
          #
          # bizzyboat.yaml commented `- cell` out of the BOAT's connections_list
          # on the water; leaving it listed here would have left the operator
          # station opening a connection the boat no longer advertises.
          #
          # RESTORE THIS LINE when a SIM is fitted and the cell path is
          # genuinely separate — together with `- cell` in bizzyboat.yaml and in
          # operator.yaml. The cell connection block in operator.yaml is left
          # intact, so nothing else needs changing.
          # - cell
