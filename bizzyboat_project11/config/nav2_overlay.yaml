# BizzyBoat (EchoBoat 240) nav2 instance overlay — Part of seafloor#3 step 2.
# Merged on top of echoboat_project11's nav2_params.base.yaml + nav2_params.240.yaml
# at launch (passed as `instance_params` to nav2_bringup_launch.py). Carries the
# sensor-rig + reflex config that used to live in the generic base, driven by
# Bizzy's 4-OAK camera rig and reflex deployment (not the hull model).
# <robot_namespace> is substituted by nav2_bringup's ReplaceString after merge.
local_costmap:
  local_costmap:
    ros__parameters:
      # 4-OAK sea_surface segmentation rig. Deep-merge replaces lists wholesale, so this
      # list restates the base's chart_layer + inflation_layer (they are NOT dropped) and
      # adds the single multi-source sea_surface layer between them. The four cameras
      # all feed one shared persistent log-odds buffer (see rolker/unh_marine_perception#19),
      # so an obstacle in the FOV overlap accumulates evidence from every camera that
      # sees it and survives the handoff between camera views.
      plugins: ["chart_layer", "sea_surface_layer", "inflation_layer"]
      sea_surface_layer:
        plugin: "sea_surface_layer::SeaSurfaceLayer"
        enabled: true
        observation_sources: ["forward", "port", "starboard", "aft"]
        forward:
          segmentation_topic: <robot_namespace>/sensors/cameras/oak_forward/segmentation
          camera_info_topic: <robot_namespace>/sensors/cameras/oak_forward/segmentation/camera_info
        port:
          segmentation_topic: <robot_namespace>/sensors/cameras/oak_port/segmentation
          camera_info_topic: <robot_namespace>/sensors/cameras/oak_port/segmentation/camera_info
        starboard:
          segmentation_topic: <robot_namespace>/sensors/cameras/oak_starboard/segmentation
          camera_info_topic: <robot_namespace>/sensors/cameras/oak_starboard/segmentation/camera_info
        aft:
          segmentation_topic: <robot_namespace>/sensors/cameras/oak_aft/segmentation
          camera_info_topic: <robot_namespace>/sensors/cameras/oak_aft/segmentation/camera_info
          # Pixel-space mask for on-boat structures (GPS antenna at bottom-
          # centre of aft FOV). Flat int list of [x_min, y_min, x_max, y_max]
          # tuples in segmentation-output pixel coordinates (downsampled to
          # 128x96 as of 2026-05-29). Tunable live via
          # `ros2 param set ... sea_surface_layer.aft.image_mask_rects`.
          image_mask_rects: [40, 65, 90, 96]
        maximum_range: 150.0
        # Tuned live on the 2026-06-01 deployment (gabby) and baked in for
        # durability across relaunch. obstacle_prob_min raised to gate weak
        # glare false positives; clear_floor eased from the -2.0 default for
        # mark persistence vs FPs; min_grazing_angle_deg at 1.5 trims the
        # least-reliable near-horizon rays (R~54m at h~1.4m, still covers the
        # +/-50m local window). See docs/logs/2026/2026-06-01_gabby_logs.md.
        obstacle_prob_min: 0.8
        obstacle_clamp: 15.0
        clear_floor: -0.5
        min_grazing_angle_deg: 2.1
        # decay raised from the 30 s default: high-confidence (>=0.8) single-
        # sighting obstacles persist longer. clear_floor eased so a one-time hit
        # resists active clearing. grazing 2.1 deg caps range ~38 m (near-field).
        decay_half_life_s: 60.0
        # Republish the lethal mask for the global-costmap SeaSurfaceRelayLayer
        # (configured in echoboat_project11's nav2_params.base.yaml — see
        # rolker/seafloor_echoboat_project11#35) so Smac plans around buoys too.
        # Empty-string would disable the publication.
        published_topic: <robot_namespace>/sea_surface/lethal_grid

collision_monitor:
  ros__parameters:
    polygons: ["CollisionSlowdown", "CollisionStop"]
    CollisionSlowdown:
      type: "polygon"
      # Box shrunk 20m->10m forward + ratio 0.3->0.5 on the 2026-06-01 (gabby)
      # deployment: the 20m/30% slowdown dropped the boat below steering-
      # authority speed when false positives tripped it. CollisionStop unchanged.
      points: "[[10.0, 3.0], [10.0, -3.0], [0.0, -3.0], [0.0, 3.0]]"
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 4
      visualize: true
      polygon_pub_topic: "collision_monitor/slowdown_polygon"
      enabled: true
    CollisionStop:
      type: "polygon"
      points: "[[5.0, 2.0], [5.0, -2.0], [0.0, -2.0], [0.0, 2.0]]"
      action_type: "stop"
      min_points: 5
      visualize: true
      polygon_pub_topic: "collision_monitor/stop_polygon"
      enabled: true
    observation_sources: ["reflex_cloud"]
    reflex_cloud:
      type: "pointcloud"
      topic: "collision_monitor/pointcloud"
      min_height: -2.0
      max_height: 2.0
      enabled: true
