# BizzyBoat (EchoBoat 240) nav2 instance overlay — Part of seafloor#3 step 2.
# Merged on top of echoboat_project11's nav2_params.base.yaml + nav2_params.240.yaml
# at launch (passed as `instance_params` to nav2_bringup_launch.py). Carries the
# sensor-rig + reflex config that used to live in the generic base, driven by
# Bizzy's 4-OAK camera rig and reflex deployment (not the hull model).
# <robot_namespace> is substituted by nav2_bringup's ReplaceString after merge.
local_costmap:
  local_costmap:
    ros__parameters:
      # Coarsened grid for bizzyboat 2026-06-12: base is 0.25 m / 400 m
      # (1600x1600 = 2.56M cells @ 5 Hz). The 4-OAK sea_surface_layer raytracing
      # over that grid pegged controller_server at ~169% CPU and the control loop
      # could not hold 5 Hz (continuous "missed control rate" warnings). 0.5 m /
      # 350 m (700x700 = 0.49M cells, ~5x fewer) dropped it to ~79%. Trade-off:
      # coarser obstacle placement and ~25 m less look-ahead per side — acceptable
      # at survey speed. Applied live first, persisted here for relaunch durability.
      resolution: 0.5
      width: 350
      height: 350
      # 4-OAK sea_surface segmentation rig. Deep-merge replaces lists wholesale, so this
      # list restates the base's inflation_layer and adds the single multi-source
      # sea_surface layer. The four cameras all feed one shared persistent log-odds
      # buffer (see rolker/unh_marine_perception#19), so an obstacle in the FOV overlap
      # accumulates evidence from every camera that sees it and survives the handoff
      # between camera views.
      # chart_layer (base's s57_layer::S57Layer) commented out for bizzyboat 2026-06-12
      # per operator; the base's chart_layer config block stays defined but unreferenced.
      plugins:
        # - "chart_layer"
        - "sea_surface_layer"
        - "inflation_layer"
      sea_surface_layer:
        plugin: "sea_surface_layer::SeaSurfaceLayer"
        enabled: true
        observation_sources: ["forward", "port", "starboard", "aft"]
        forward:
          segmentation_topic: <robot_namespace>/sensors/cameras/oak_forward/segmentation
          camera_info_topic: <robot_namespace>/sensors/cameras/oak_forward/segmentation/camera_info
        port:
          segmentation_topic: <robot_namespace>/sensors/cameras/oak_port/segmentation
          camera_info_topic: <robot_namespace>/sensors/cameras/oak_port/segmentation/camera_info
        starboard:
          segmentation_topic: <robot_namespace>/sensors/cameras/oak_starboard/segmentation
          camera_info_topic: <robot_namespace>/sensors/cameras/oak_starboard/segmentation/camera_info
        aft:
          segmentation_topic: <robot_namespace>/sensors/cameras/oak_aft/segmentation
          camera_info_topic: <robot_namespace>/sensors/cameras/oak_aft/segmentation/camera_info
          # Pixel-space mask for on-boat structures (GPS antenna at bottom-
          # centre of aft FOV). Flat int list of [x_min, y_min, x_max, y_max]
          # tuples in segmentation-output pixel coordinates (downsampled to
          # 128x96 as of 2026-05-29). Tunable live via
          # `ros2 param set ... sea_surface_layer.aft.image_mask_rects`.
          image_mask_rects: [40, 65, 90, 96]
        maximum_range: 150.0
        # Tuned live on the 2026-06-03 deployment (gabby) and baked in for
        # durability across relaunch — supersedes the 2026-06-01 baseline
        # (obstacle_prob_min 0.8 / grazing 2.1 / free 0.0 / lethal 1.0). The
        # 06-03 stack was sensitised for small low-contrast targets after
        # repeatedly missing lobster pots, and field-validated by a clean
        # detect->avoid of a real pot (~15:54). obstacle_prob_min lowered to 0.7
        # (primary weak/small-target lever; trades a tolerable amount of off-axis
        # glare FP — acceptable per operator); min_grazing_angle_deg eased to 1.6
        # (range ~38 m -> ~50 m); free/lethal thresholds lowered so brief sightings
        # register and marks latch in ~1 strong hit ("make it take fewer hits to
        # stick"). clear_floor eased from the -2.0 default for mark persistence vs
        # FPs. See docs/logs/2026/2026-06-03_gabby_logs.md (and 06-01 for history).
        obstacle_prob_min: 0.7
        obstacle_clamp: 15.0
        clear_floor: -0.5
        min_grazing_angle_deg: 1.6
        # free/lethal thresholds: code defaults are 0.0 / 1.0. Lowered live on
        # 06-03 so weak/brief lobster-pot sightings register (free 0.3) and a
        # single strong hit latches lethal (lethal 0.9, with max_evidence_step
        # 0.85). Trade-off: a single flicker/glare FP also latches more readily.
        free_threshold: 0.3
        lethal_threshold: 0.9
        # decay raised from the 30 s default: high-confidence (>=0.7) single-
        # sighting obstacles persist longer. clear_floor eased so a one-time hit
        # resists active clearing.
        decay_half_life_s: 60.0
        # Republish the lethal mask for the global-costmap SeaSurfaceRelayLayer
        # (configured in echoboat_project11's nav2_params.base.yaml — see
        # rolker/seafloor_echoboat_project11#35) so Smac plans around buoys too.
        # Empty-string would disable the publication.
        published_topic: <robot_namespace>/sea_surface/lethal_grid

global_costmap:
  global_costmap:
    ros__parameters:
      # chart_layer commented out for bizzyboat 2026-06-12 per operator. The base
      # (echoboat_project11/config/nav2_params.base.yaml) lists the global plugins as
      # ["chart_layer", "sea_surface_relay", "inflation_layer"]; deep-merge replaces
      # lists wholesale, so this restates that list minus chart_layer. The base's
      # chart_layer config block stays defined but unreferenced (harmless).
      plugins:
        # - "chart_layer"
        - "sea_surface_relay"
        - "inflation_layer"

collision_monitor:
  ros__parameters:
    polygons: ["CollisionSlowdown", "CollisionStop"]
    CollisionSlowdown:
      type: "polygon"
      # 20 m forward box / 0.3 slowdown_ratio — original validated reflex (RESTORED).
      # 2026-06-02 field experiment (gabby) tried 8 m box / 0.7 ratio for
      # "turn-before-slowdown" (let the avoider steer clear before braking). It
      # worked at LOW speed, but at default survey speed (0.77 m/s) the boat could
      # NOT out-turn a moored sailboat in time (yaw capped at 1.0 rad/s) and, with
      # the slowdown margin removed, carried speed to CollisionStop → emergency
      # stop → manual takeover (near-miss, 15:27). REVERTED. Turn-before-slowdown
      # is speed-limited; the slowdown braking is needed at speed to buy the avoider
      # time. Revisit post-deployment (faster turn authority, or speed-scaled CA
      # zones). Full experiment values in docs/logs/2026/2026-06-02_gabby_logs.md.
      points: "[[20.0, 3.0], [20.0, -3.0], [0.0, -3.0], [0.0, 3.0]]"
      action_type: "slowdown"
      slowdown_ratio: 0.3
      min_points: 4
      visualize: true
      polygon_pub_topic: "collision_monitor/slowdown_polygon"
      enabled: true
    CollisionStop:
      type: "polygon"
      # ±2.0 m width — original (RESTORED; the 2026-06-02 ±1.5 m narrowing was
      # reverted with the slowdown experiment above).
      points: "[[5.0, 2.0], [5.0, -2.0], [0.0, -2.0], [0.0, 2.0]]"
      action_type: "stop"
      min_points: 5
      visualize: true
      polygon_pub_topic: "collision_monitor/stop_polygon"
      enabled: true
    observation_sources: ["reflex_cloud"]
    reflex_cloud:
      type: "pointcloud"
      topic: "collision_monitor/pointcloud"
      min_height: -2.0
      max_height: 2.0
      enabled: true

# Marine CA safety node (rolker/unh_marine_navigation#64) — DEFAULT helm gate on
# BizzyBoat (use_ca_safety:=true), replacing the Collision Monitor block above
# (kept as the use_ca_safety:=false fallback). Per-rig tuning: the reflex cloud
# feed + zone geometry mirroring the Collision Monitor it supersedes (20 m
# slowdown box / 5 m x 4 m stop), now speed-scaled. Base wiring (frames, cmd_vel
# topics, odom, viz topics) is in seafloor's nav2_params.base.yaml.
# NB: reverse-yaw passthrough stays OFF (cancel_yaw_during_reverse: true) until
# the sim yaw-sign-in-reverse test passes — see #64.
ca_safety:
  ros__parameters:
    pointcloud_topic: "collision_monitor/pointcloud"
    slowdown_min_length: 5.0
    slowdown_max_length: 20.0
    slowdown_width: 6.0
    ttc_time_constant: 4.0
    stop_length: 5.0
    stop_width: 4.0
    reverse_speed: 0.5
    reverse_distance: 3.0
    reverse_duration: 4.0
    cancel_yaw_during_reverse: true

# Controller-layer survey-line obstacle avoidance (rolker/unh_marine_navigation#59,
# echoboats#206). Flip BizzyBoat's FollowPath controller from the bare crabbing
# tracker to the AvoidanceController decorator, with crabbing as its inner. The
# decorator reshapes the followed path around obstacles using the controller_server's
# own in-process local costmap (fresh by construction — fixes the staleness/anchor
# problems of the old BT-node avoider, rolker/unh_marine_navigation#57).
#
# Deep-merged over seafloor's nav2_params.base.yaml: this overrides FollowPath.plugin
# and adds primary_controller + the avoidance tunables; the inner crabbing keeps
# reading the base's FollowPath.default_speed / pid.* / visualization (same FollowPath
# namespace), so the tracker itself is unchanged. BizzyBoat-only — other EchoBoats
# stay crabbing-direct.
#
# REQUIRES marine_nav_avoidance_controller built in core_ws (PR
# rolker/unh_marine_navigation#60). Without the plugin, controller_server cannot
# load AvoidanceController and there is no FollowPath controller — deploy together.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "marine_nav_avoidance_controller::AvoidanceController"
      primary_controller: "marine_nav_crabbing_path_follower::CrabbingPathFollower"
      # Corridor-solver tunables (live via `ros2 param set <controller_server>
      # FollowPath.<name>`). 2026-06-02 field tune (gabby): obstacle_avoidance_weight
      # 0.5 (was 1.0 == 1:1) → 2:1 toward line_following for gentler bends, plus
      # chatter_damping_weight 0.5 (was 0.0) to steady the corridor tick-to-tick.
      # Validated on water — boat routed around a moored sailboat twice. SIM-validate
      # before trusting widely. anchor_behind_distance anchors the detour entry behind
      # the boat so the tracker actually follows it (#59 fix).
      max_deviation: 6.0
      along_track_spacing: 2.0
      lateral_resolution: 0.5
      line_following_weight: 1.0
      obstacle_avoidance_weight: 0.5
      smoothness_weight: 2.0
      chatter_damping_weight: 0.5
      max_lateral_change: 1.0
      anchor_behind_distance: 4.0
      # avoid_speed 0.0 = no slowdown through the manoeuvre (controller default
      # speed). Off for v1; enable + tune on the water if a slowdown is wanted.
      avoid_speed: 0.0
      # Inner-crabbing cross-track slew limiter (rolker/unh_marine_navigation#66
      # first cut, PR #75; enabled per #253). Caps how fast the cross-track error
      # fed to the PID may change, so replan/reshape reference steps — the #250
      # zig-zag trigger — ramp in instead of slamming the helm. Node default is
      # 0.0 = disabled; 3.0 m/s sits above genuine lateral drift (~boat speed)
      # but well below an instantaneous replan step. NB the limiter also ramps
      # re-acquisition from a large offset (mission start far off the line, big
      # avoidance excursion) at this same rate — don't set it low. Live-tunable:
      # `ros2 param set /bizzy/controller_server FollowPath.cross_track_error_slew_rate 0.0`
      # is the instant revert hatch.
      cross_track_error_slew_rate: 3.0
      # 2026-06-16 field tune (gabby): override the base FollowPath PID. The
      # base p=-20 limit-cycles the line-follower at survey speeds >~3 kt — the
      # cross-track loop gain scales with boat speed, so -20 sits past the
      # stability margin above ~3 kt (sustained ~±1 m weave at 3.5 kt, output
      # ±23). p=-13 restores margin: bounded ~±0.25 m, output ~±5, stable across
      # 3.0-3.75 kt (boat saturates ~3.85 kt). d -0.6→-1.2 kept (operator
      # preference; minor effect — the weave was over-gain, not under-damped).
      # Proper fix is speed-normalised gains (gain scheduling) — now enabled
      # below via gain_ref_speed (rolker/unh_marine_navigation#76, echoboats#292).
      # Live-set during the session; banked here so it survives a nav relaunch.
      # Other pid.* keys match the base.
      pid:
        p: -13.0
        i: -0.5
        d: -1.2
        i_clamp_max: 30.0
        i_clamp_min: -30.0
        u_clamp_max: 90.0
        u_clamp_min: -90.0
        activate_state_publisher: true
        # Speed-normalise the cross-track gain (1/v law, rolker/unh_marine_navigation#76):
        # the outer cross-track loop gain is ∝ v·p, so a flat p loses margin as
        # speed rises (the -20→-13 field tune above only re-anchored at 3.5 kt).
        # crab_angle is scaled by gain_ref_speed / max(target_speed, gain_v_min)
        # right after the PID, holding the cross-track response ~constant across
        # speed. REQUIRES the #76 build of marine_nav_crabbing_path_follower on
        # gabby (core_ws) — older binaries don't declare these keys and ignore
        # them (inert, harmless). NOT pre-tested: anchor 1.8 m/s = 3.5 kt, where
        # p=-13 is field-validated, so this is a NO-OP at 3.5 kt and only adjusts
        # off-anchor (3.0 kt → eff -15.2, 4.0 kt → eff -11.4). Tune live + record
        # final anchor (echoboats#292). Live-tunable / instant revert hatch:
        # `ros2 param set /bizzy/controller_server FollowPath.pid.gain_ref_speed 0.0`
        gain_ref_speed: 1.8   # 3.5 kt anchor; 0.0 = disabled (flat-gain behaviour)
        gain_v_min: 0.5       # divisor floor; no blow-up at creep / station-keep
