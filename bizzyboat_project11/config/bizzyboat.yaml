# Legacy style predates the workspace yamllint hook (PR #374): aligned-colon
# tables, 2-space list indents, and long annotated lines fail rules this
# field-edited file has never been held to. Restyling ~34 sites would create
# needless merge risk against field-side hotfixes mid-season, so those rules
# are disabled file-wide pending the deliberate cleanup tracked in #376.
# yamllint disable rule:colons rule:indentation rule:line-length
/**/helm_manager:
  ros__parameters:
    output_type: twist
    max_speed: 2.0
    max_yaw_speed: 1.0  # vehicle-capability backstop (was 0.5); survey-turn limit belongs in Nav2 smoother — see #124 §2
    # Curvature-preserving speed regulation (unh_marine_autonomy ADR-0012, #417):
    # when commanded (v, w) exceeds the envelope below, the helm scales BOTH by
    # the same factor so the commanded turn radius is preserved at reduced speed
    # (instead of the yaw clip silently widening the turn).
    #
    # DISABLED 2026-08-06 — the steering servos were reinstalled and the boat is
    # VECTORED THRUST again, so the envelope below (measured on the temporary
    # differential drivetrain) no longer describes this vehicle. Disabling is the
    # documented way to stand the feature down without reverting it: the gate is
    # the node's own default (helm_manager.cpp:69 declares it false), and with it
    # false the independent max_speed / max_yaw_speed clamps above are the sole
    # limiter — i.e. exactly the pre-2026-08-04 vectored behaviour that ran the
    # #124 surveys. The feature, ADR-0012 and this table all stay in place.
    #
    # TO RE-ENABLE ON VECTORED THRUST: re-measure the envelope on the water and
    # replace the table, THEN flip the gate. Do not simply flip the gate — the
    # numbers below would throttle a vectored boat to roughly a third of its real
    # yaw capability (differential p95 0.28-0.40 rad/s vs the vectored 0.91 rad/s
    # pivot measured in #124). Note the planner's minimum_turning_radius has also
    # returned to the factory-240 vectored 1.5 m, which needs no regulation to be
    # achievable — the 3.0 m value that DEPENDED on this feature is gone with the
    # nav2_overlay.yaml differential block.
    #
    # Envelope below: measured 2026-08-04 on the TEMPORARY differential
    # drivetrain (full-day analysis, 218133 samples, docs/logs/2026/
    # 2026-08-04_gabby_logs.md): p95 achievable |yaw| (rad/s) at band-center
    # speeds (m/s); v=0 entry is the measured pivot p95 (rest capability must
    # be explicit — the helm rejects curves that don't start at v=0). Retained
    # only as the reference measurement for a future differential refit.
    capability_curve_enabled: false
    capability_curve_v_omega_max: [0.0, 0.28, 0.15, 0.26, 0.55, 0.38, 1.05, 0.40, 1.55, 0.20, 2.15, 0.20]
    capability_curve_margin: 0.8

/**/platform_sender:
  ros__parameters:
    width: 0.9
    length: 2.4
    reference_x: 0.0
    reference_y: 0.0
    color:
      red: 1.0
      green: 0.85
      blue: 0.0

    nav:
      # SBG INS primary, FCU fallback (#339) — list order is preference, as on
      # izzyboat (posmv, mru). SBG topics are the namespaced ros_standard
      # messages from sbg_launch (use_enu:true).
      source_names:
        - sbg
        - fcu
      sources:
        sbg:
          topics:
            orientation: "sensors/sbg/imu/data"
            position: "sensors/sbg/imu/nav_sat_fix"
            velocity: "sensors/sbg/imu/velocity"
        fcu:
          topics:
            orientation: "mavros/imu/data"
            position: "mavros/global_position/global"
            velocity: "mavros/local_position/velocity_body"

/**/deltat:
  ros__parameters:
    frame_id: bizzy/deltat

/**/cube_bathymetry:
  ros__parameters:
    map_frame: bizzy/map
    cell_size: 0.5
    # Persist draft coverage tiles so a stack restart re-primes the GeoMapSheet
    # instead of starting empty (open item from 2026-06-29 gabby deployment).
    # This IS the depths store (ADR-0010 D3/D8, uma#310): draft_dir is a
    # store ROOT — the node writes the store's draft/ layer under it
    # (<draft_dir>/draft/*.tif) — so with the costmap's bathymetry_layer
    # reading the same root (store_path ~/data/world/depths), nav reads
    # exactly what CUBE writes. The pre-D8 cube_draft side-dir is retired;
    # its legacy survey/ tiles must NOT auto-migrate to processed/ on the
    # rebuild day (they carry live-node flyers) — route them to draft/ or
    # archive. Outside the ~/data/logs/ offload pull. Saves run every
    # save_interval (default 30s) while ACTIVE; lossless reload on
    # configure (cube ADR-0001).
    draft_dir: /home/field/data/world/depths

# M3 -> SonarDetections -> soundings: the CUBE error model's pose comes from TF
# (roll/pitch from level_frame, heave from tide_frame) + /odom (SOG); odom is
# remapped to /bizzy/odom in perception_launch.py.
/**/detections_to_pointcloud:
  ros__parameters:
    base_link_frame: bizzy/base_link
    level_frame: bizzy/base_link_north_up
    tide_frame: bizzy/map_tide

/**/mru_transform:
  ros__parameters:
    # FCU primary, SBG fallback (reverted 2026-06-29, gabby deployment).
    # Arbitration is strict priority-preference (sensor_names order, #339): the
    # highest-priority *fresh* source owns the output, so the FCU drives nav
    # whenever it is healthy and the SBG takes over only on a real FCU dropout
    # past sensor_timeout — regardless of relative sample rates.
    #
    # Why reverted: with SBG primary, the sea_surface_layer projection showed a
    # constant ~2 deg roll offset (SBG-minus-FCU, measured underway 2026-06-29),
    # tilting the costmap and producing aft false positives. mru_transform does
    # NOT apply the IMU->base_link URDF rotation to attitude (it is passed
    # through raw — mru_transform.cpp:145), so the SBG mounting/alignment offset
    # reaches the costmap directly. FCU attitude verified stable the same day
    # (10 Hz, no dropouts/glitches, valid covariance). Root cause (SBG roll
    # alignment vs the 2026-06-27 vehicle-align check that reported yaw 0.01 deg
    # / roll-pitch tie-up) deferred to wrap-up.
    #
    # SBG topics are the namespaced ros_standard messages (use_enu:true);
    # frame_id sbg_gnss_primary (identity vs base_link) serves both the fix
    # lever-arm and the gyro path.
    sensors:
      sbg:
        topics:
          orientation: "sensors/sbg/imu/data"
          position: "sensors/sbg/imu/nav_sat_fix"
          velocity: "sensors/sbg/imu/velocity"
      fcu:
        topics:
          orientation: "mavros/imu/data"
          # NOT mavros/global_position/global: mavros builds that NavSatFix by
          # taking GLOBAL_POSITION_INT's AMSL altitude and adding a
          # GeographicLib EGM96-5 undulation, while the receiver derived that
          # AMSL value with its own internal geoid table. The two models
          # disagree by 0.626 m here (measured 2026-08-21), and the difference
          # landed in odom.z, the sea-surface estimate, map_tide and every
          # sounding. echo_helm's ellipsoidal_fix_node removes the round trip
          # and republishes a NavSatFix whose altitude really is above the
          # WGS-84 ellipsoid, as the message type specifies. Retire this
          # indirection if mavros starts preferring alt_ellipsoid upstream.
          position: "mavros/global_position/global_ellipsoidal"
          velocity: "mavros/local_position/velocity_body"
    sensor_names:
    - fcu
    - sbg
    sensor_timeout: 0.5

/**/udp_bridge:
  ros__parameters:
    name: bizzy
    port: 4200
    maximum_packet_size: 1000
    remotes_list:
      - operator
    remotes:
      operator:
        connections_list:
          # wifi STOOD DOWN 2026-08-20 for ROC-based operation. The operator
          # station (pandy) is at CCOM, and wifi on this boat is line-of-sight
          # only (see the note in the wifi block below), so pandy never
          # advertises a wifi address. The connection then sits at host='' with
          # the full topic list pointed at it and delivers nothing.
          #
          # udp_bridge now short-circuits an unaddressed connection
          # (Connection::send guard, test_unaddressed_connection.cpp), so this
          # is no longer expensive -- it is commented out to keep the link
          # inventory honest rather than to save CPU. Before that fix it cost
          # ~1.8 MB/s of copies and resend bookkeeping and held a core at 96%.
          #
          # RESTORE THIS LINE when operating with an operator station in wifi
          # range (a boat-side or dockside laptop rather than the ROC). Nothing
          # else needs changing: the wifi connection block below is left intact.
          # - wifi
          - vpn
          # cell STOOD DOWN 2026-08-25 (field, gabby) — there is no SIM card in
          # the boat's modem, so this connection never had an independent path.
          # Measured on the water: cell and vpn both resolve to the same physical
          # uplink (ip route get shows 192.168.24.144 and 192.168.22.144 BOTH via
          # 192.168.20.1 dev enp7s0), so the ~85 kB/s of cell telemetry was pure
          # duplicate load competing with the vpn on one pipe. RESTORE THIS LINE
          # when a SIM is fitted and the cell path is genuinely separate; the cell
          # connection block below is left intact.
          # - cell
        connections:
          wifi:
            maximum_bytes_per_second: 1500000
            topics_list:
            - battery
            - command_response
            - deltat
            - deltat_grid
            - diagnostics
            - heartbeat
            - heartbeat_nav
            - mission_tasks
            - hover_viz
            - local_costmap_windowed
            - local_costmap_footprint
            - collision_pointcloud
            - collision_slowdown_polygon
            - collision_stop_polygon
            - collision_monitor_state
            # OAK ffmpeg video removed from the WiFi path (2026-08-03 field
            # tune, gabby) to free link budget. Segmentation overlays stay.
            # RESTORED 2026-08-05 (Lewes, operator decision): the 08-03 removal
            # was made when each stream cost ~100 KB/s at 800 kbps; at the
            # 100 kbps now persisted in oak_cameras_launch.py all four together
            # are ~126 KB/s, and wifi measured this session at cap with ZERO
            # drops and zero duplicates while carrying 546-856 KB/s, i.e. ample
            # headroom. WiFi is line-of-sight only (no over-the-horizon), so
            # this restores in-range video without touching the OTH budget.
            - oak_forward_ffmpeg
            - oak_segmentation_forward
            - oak_segmentation_forward_info
            - oak_segmentation_forward_raw
            - oak_starboard_ffmpeg
            - oak_segmentation_starboard
            - oak_segmentation_starboard_info
            - oak_segmentation_starboard_raw
            - oak_aft_ffmpeg
            - oak_segmentation_aft
            - oak_segmentation_aft_info
            - oak_segmentation_aft_raw
            - oak_port_ffmpeg
            - oak_segmentation_port
            - oak_segmentation_port_info
            - oak_segmentation_port_raw
            - odom
            - path_follower_visualization
            - survey_obstacle_avoidance
            - received_global_plan
            - plan
            - platforms
            - mavros_gps_status
            - mavros_position
            - mavros_orientation
            - mavros_velocity
            - mavros_position_ekf
            - mavros_velocity_body
            - mavros_state
            - mavros_rc_out
            - mavros_rc_in
            - mavros_cmd_vel
            - sound_speed
            - tf
            - tf_static
            - usb_camera
            - usb_camera_info
            - sidescan_port
            - sidescan_starboard
            - watercolumn_down
            - sidescan_nadir_depth
            - sidescan_water_temperature
            topics:
              command_response: {source: marine/response}
              diagnostics: {source: /diagnostics}
              heartbeat: {source: marine/heartbeat}
              heartbeat_nav: {source: marine/status/mission_manager}
              # Structured running-task state for CAMP's task view (camp#123).
              # Sibling of heartbeat_nav; same full-rate cadence (the boat
              # publishes it periodically). Carries task poses, so it can be
              # larger than the flattened heartbeat over cell — tune cadence
              # after measuring the link budget, not blind (PR#239 review).
              mission_tasks: {source: marine/status/mission_tasks}
              hover_viz: {source: hover_visualization}
              # Cropped local-costmap window for operator SA (unh_marine_navigation#38,
              # #127). Replaces the raw local_costmap, whose full grid lost ~78% over
              # the bridge. Throttled to 1 Hz on WiFi.
              local_costmap_windowed: {source: local_costmap/costmap_windowed, period: 1.0}
              local_costmap_footprint: {source: local_costmap/published_footprint}
              # Reflex collision feedback (#170). Cloud measured tiny (<2 KB/msg);
              # danger-zone polygons + state are smaller. Unthrottled on WiFi.
              collision_pointcloud: {source: collision_monitor/pointcloud}
              collision_slowdown_polygon: {source: collision_monitor/slowdown_polygon}
              collision_stop_polygon: {source: collision_monitor/stop_polygon}
              collision_monitor_state: {source: collision_monitor_state}
              odom: {source: odom}
              # Bridge subscription queue depths sized for fail-fresh under link
              # saturation (#287): bulk best-effort streams kept shallow so a stalled
              # link drops the stale backlog instead of delivering it ~30 s late.
              # ffmpeg video=5 (retains a keyframe across a brief stall); compressed
              # segmentation overlays=2 (independent frames); sidescan/watercolumn=25.
              # Reliable control/telemetry left at the bridge default (10).
              oak_forward_ffmpeg: {source: sensors/cameras/oak_forward/image_raw/ffmpeg, queue_size: 5}
              oak_segmentation_forward:      {source: sensors/cameras/oak_forward/segmentation/compressed, queue_size: 2}
              oak_segmentation_forward_info: {source: sensors/cameras/oak_forward/segmentation/camera_info}
              oak_segmentation_forward_raw:    {source: sensors/cameras/oak_forward/segmentation, period: -1.0, queue_size: 2}
              oak_starboard_ffmpeg: {source: sensors/cameras/oak_starboard/image_raw/ffmpeg, queue_size: 5}
              oak_segmentation_starboard:      {source: sensors/cameras/oak_starboard/segmentation/compressed, queue_size: 2}
              oak_segmentation_starboard_info: {source: sensors/cameras/oak_starboard/segmentation/camera_info}
              oak_segmentation_starboard_raw:    {source: sensors/cameras/oak_starboard/segmentation, period: -1.0, queue_size: 2}
              oak_aft_ffmpeg: {source: sensors/cameras/oak_aft/image_raw/ffmpeg, queue_size: 5}
              oak_segmentation_aft:      {source: sensors/cameras/oak_aft/segmentation/compressed, queue_size: 2}
              oak_segmentation_aft_info: {source: sensors/cameras/oak_aft/segmentation/camera_info}
              oak_segmentation_aft_raw:    {source: sensors/cameras/oak_aft/segmentation, period: -1.0, queue_size: 2}
              oak_port_ffmpeg: {source: sensors/cameras/oak_port/image_raw/ffmpeg, queue_size: 5}
              oak_segmentation_port:      {source: sensors/cameras/oak_port/segmentation/compressed, queue_size: 2}
              oak_segmentation_port_info: {source: sensors/cameras/oak_port/segmentation/camera_info}
              oak_segmentation_port_raw:    {source: sensors/cameras/oak_port/segmentation, period: -1.0, queue_size: 2}
              path_follower_visualization: {source: path_follower_visualization}
              # Survey-line obstacle-avoidance overlay (unh_marine_navigation#30) —
              # published only while deviating; small + intermittent, so unthrottled
              # like the path-follower viz. CAMP auto-discovers the MarkerArray.
              survey_obstacle_avoidance: {source: survey_obstacle_avoidance}
              # Followed path for CAMP's platform path-line overlay (camp#55).
              received_global_plan: {source: received_global_plan}
              deltat: {source: sensors/deltat/soundings}
              deltat_grid: {source: sensors/deltat/grid}
              battery: {source: /bizzy/mavros/battery}
              plan: {source: plan}
              platforms: {source: /marine/platforms}
              mavros_gps_status: {source: mavros/gpsstatus/gps1/raw}
              mavros_orientation: {source: mavros/imu/data}
              mavros_position: {source: mavros/global_position/raw/fix}
              mavros_velocity: {source: mavros/global_position/raw/gps_vel}
              mavros_position_ekf: {source: mavros/global_position/global}
              mavros_velocity_body: {source: mavros/local_position/velocity_body}
              # rqt_boat_state operator panel (rqt_operator_tools#85): FCU mode,
              # actual/RC PWM, autonomy setpoint, and sound speed.
              mavros_state: {source: mavros/state}
              mavros_rc_out: {source: mavros/rc/out}
              mavros_rc_in: {source: mavros/rc/in}
              mavros_cmd_vel: {source: mavros/setpoint_velocity/cmd_vel}
              sound_speed: {source: sensors/sound_speed/sound_speed}
              tf: {source: /tf, queue_size: 25}
              tf_static: {source: /tf_static}
              usb_camera: {source: sensors/cameras/usb/image_raw/compressed, period: 1.0}
              usb_camera_info: {source: sensors/cameras/usb/camera_info}
              # Garmin sidescan (port/stbd) + water-column (down) imagery for the
              # operator's live waterfall/echogram, plus the per-ping nadir depth
              # and water temperature. Full rate on WiFi (~150 KB/s for the three
              # RawSonarImage channels); the rate limiter shares the budget with
              # the cameras. RawSonarImage is best_effort, like the camera streams.
              sidescan_port: {source: sensors/sidescan/garmin_sidescan/sonar_image_port, queue_size: 25}
              sidescan_starboard: {source: sensors/sidescan/garmin_sidescan/sonar_image_starboard, queue_size: 25}
              watercolumn_down: {source: sensors/sidescan/garmin_sidescan/sonar_image_down, queue_size: 25}
              sidescan_nadir_depth: {source: sensors/sidescan/garmin_sidescan/nadir_depth}
              sidescan_water_temperature: {source: sensors/sidescan/garmin_sidescan/water_temperature}

          vpn:
            # Raised 20% (1.0 -> 1.2 MB/s) to absorb the port/stbd ffmpeg streams
            # re-enabled on VPN below (period: -1.0 removed) without starving the
            # other OTH streams that share this budget (#287).
            # Raised again 1.2 -> 1.5 MB/s (#389): level-11 coverage tiles were
            # rate-starved at the 2026-07-23 and 2026-07-29 deployments; the
            # operator raised this live both times and tile delivery recovered
            # with no observed side effects. Persisting the field-proven value.
            #
            # LOWERED 1.5 -> 1.0 MB/s in the field 2026-08-05 (Lewes, DE).
            # 1.5 MB/s is ABOVE the link's real capacity: the vpn knee measured
            # ~1.2 MB/s on 2026-08-03. Authorising more than the pipe carries is
            # what starts the congestion spiral — the wire loses packets, the
            # receiver requests resends (salmon measured 67% of vpn arrivals as
            # DUPLICATES, only ~370 KB/s useful out of 1107 KB/s), resends crowd
            # out fresh data, delivery falls under the udp_bridge#43 admission
            # threshold of 90%, and the AIMD halves repeatedly to its 10% floor.
            # Measured at the floor on 2026-08-05: 1272643 B/s offered on vpn,
            # 82.4% DROPPED — coverage_tiles 100%, coverage_catalog 66.7%, oak
            # ffmpeg 89-94%, and even /tf 44.6% and mavros position/battery ~47%.
            # Sender-side dropping is strictly better than wire loss here: a
            # message the bridge declines costs nothing, while a message the WIRE
            # loses costs one fragment out of a 180-fragment tile or a
            # ~90-fragment keyframe, destroying the whole message AND generating
            # resend traffic. Offering less than the link truly carries keeps the
            # admission controller at cap instead of pinned at 10%.
            #
            # RESTORED 1.0 -> 1.5 MB/s later the same day (2026-08-05, Lewes),
            # operator decision, once the OFFERED load had been cut at source and
            # the cap was no longer the binding constraint. What actually fixed
            # the spiral was reducing demand, not capping it: h265_bitrate_kbps
            # 800 -> 100 on the four OAKs (~404 -> ~126 KB/s) plus the
            # collision_pointcloud 1 Hz throttle on this connection. After those,
            # vpn measured 392645 B/s offered with a 0.0000% drop rate and
            # admission held at cap in every sample — roughly a quarter of even
            # the 1.0 MB/s cap, so the cap value stopped mattering for shaping.
            # A HIGHER cap is actively BETTER for coverage_tiles: connection.cpp
            # can_send() requires a WHOLE message to fit the instantaneous
            # budget, and tiles measure ~183 KB compressed (every one a full
            # 960x960 window — see cube_bathymetry#112), so the 1.0 MB/s cap left
            # only ~95 KB/s of headroom and blocked them outright while every
            # other topic recovered. The lower cap helped everything EXCEPT the
            # payload this link exists to carry.
            # GUARD: this only holds while offered load stays well under the
            # ~1.2 MB/s knee measured 2026-08-03. If the OAK bitrate is raised
            # back toward 800, or the pointcloud throttle is removed, or new bulk
            # topics are added to this connection, 1.5 MB/s again authorises more
            # than the wire carries and the admission collapse returns — it cost
            # 82% of ALL vpn traffic including ~45% of /tf and mavros telemetry.
            # Re-measure before adding load, not after.
            maximum_bytes_per_second: 1500000
            topics_list:
            # CUBE coverage tiles for CAMP live-tile view (set up live 2026-06-29
            # via udp_bridge remote_advertise, confirmed working; persisted here).
            # STOOD DOWN 2026-08-25 (field, gabby) to keep the vpn connection
            # inside its budget: a whole tile was 960x960 cells x 4 bytes =
            # ~3.7 MB, more than twice the whole 1.5 MB/s connection budget,
            # and sub-window patching was not yet implemented on the producer.
            # The vpn admission controller collapses to its floor when offered
            # load exceeds what the link delivers, and recovery is a ~30-40 s
            # ramp, so each collapse was a multi-second blackout at the
            # operator. See docs/logs/2026/2026-08-25_gabby_logs.md.
            #
            # RESTORED 2026-08-26 (field, gabby): the stand-down condition is
            # met. cube_bathymetry#112 landed the sub-window patching, so the
            # producer now bounds message size. Measured on station at
            # Appledore after the cube restart: the node's own instrumentation
            # put the sub-window push at 14.4/16.8/0.1/16.7 percent of what
            # whole-tile mode would have sent over four consecutive 30 s
            # windows, and udp_bridge topic_statistics measured coverage_tiles
            # at 926.2 B/s send success and coverage_catalog at 318.2 B/s
            # against the 1.5 MB/s cap, zero dropped. See
            # docs/logs/2026/2026-08-26_gabby_logs.md.
            #
            # manda_coverage_swath stays stood down: it was grouped into the
            # same 2026-08-25 stand-down for budget, but #112 does not shrink
            # it, so restoring it is a separate and so far unmeasured call.
            - coverage_catalog
            - coverage_tiles
            # - manda_coverage_swath
            - battery
            - command_response
            - diagnostics
            - heartbeat
            - heartbeat_nav
            - mission_tasks
            - hover_viz
            - local_costmap_windowed
            - local_costmap_footprint
            - path_follower_visualization
            - survey_obstacle_avoidance
            - received_global_plan
            - collision_pointcloud
            - collision_slowdown_polygon
            - collision_stop_polygon
            - collision_monitor_state
            - oak_forward_ffmpeg
            - oak_segmentation_forward
            - oak_segmentation_forward_info
            - oak_segmentation_forward_raw
            - oak_starboard_ffmpeg
            - oak_segmentation_starboard
            - oak_aft_ffmpeg
            - oak_segmentation_aft
            - oak_port_ffmpeg
            - oak_segmentation_port
            - odom
            - plan
            - platforms
            - mavros_gps_status
            - mavros_position
            - mavros_orientation
            - mavros_velocity
            - mavros_position_ekf
            - mavros_velocity_body
            - mavros_state
            - mavros_rc_out
            - mavros_rc_in
            - mavros_cmd_vel
            - sound_speed
            - tf
            - tf_static
            - usb_camera
            - sidescan_port
            - sidescan_starboard
            - watercolumn_down
            - sidescan_nadir_depth
            - sidescan_water_temperature
            topics:
              command_response: {source: marine/response}
              diagnostics: {source: /diagnostics}
              heartbeat: {source: marine/heartbeat}
              heartbeat_nav: {source: marine/status/mission_manager}
              # Structured running-task state for CAMP's task view (camp#123).
              # Sibling of heartbeat_nav; same full-rate cadence (the boat
              # publishes it periodically). Carries task poses, so it can be
              # larger than the flattened heartbeat over cell — tune cadence
              # after measuring the link budget, not blind (PR#239 review).
              mission_tasks: {source: marine/status/mission_tasks}
              hover_viz: {source: hover_visualization}
              # Reflex collision cloud + danger-zone polygons + state (#170). Sent
              # unthrottled on VPN too: each is small (cloud <2 KB/msg, polygons +
              # state smaller) and is core OTH situational awareness — the operator's
              # only view of what reflex CA sees and whether it's intervening. The
              # 1 Hz throttle these previously carried was removed deliberately to
              # prioritise SA overlays on the link; the heavy costmap window below
              # keeps its throttle as the budget's one big consumer.
              #
              # THROTTLE RESTORED ON VPN ONLY, 2026-08-05 (Lewes). The "cloud
              # <2 KB/msg" premise above is NO LONGER TRUE and is the reason the
              # un-throttling decision needs revisiting: measured on gabby this
              # session the cloud is ~57.6 KB/msg compressed (288 KB/s at 5 Hz,
              # ~180 KB/msg pre-compression) — roughly 29x the size that
              # justified removing the throttle. It is now the LARGEST single
              # consumer on vpn at 34% of all traffic, not the costmap window.
              # At 5 Hz it was 84.3% DROPPED, so the operator was actually
              # receiving ~0.8 Hz of randomly-surviving frames. A deterministic
              # 1 Hz is strictly BETTER situational awareness than that: regular
              # cadence, no random gaps, and ~230 KB/s returned to the link for
              # coverage_tiles and telemetry that were being starved.
              # period is the CORRECT mechanism here (unlike coverage_tiles):
              # each cloud is a full snapshot of what reflex CA currently sees,
              # so a skipped message is superseded by the next and no unique
              # data is lost.
              # WiFi deliberately left UNTHROTTLED below — it has headroom and
              # measures zero drops, so in-range SA keeps the full 5 Hz and only
              # the over-the-horizon path degrades to 1 Hz.
              # Revisit if the reflex-CA cloud is ever size-bounded at the
              # publisher; the throttle is a workaround for message size.
              collision_pointcloud: {source: collision_monitor/pointcloud, period: 1.0}
              collision_slowdown_polygon: {source: collision_monitor/slowdown_polygon}
              collision_stop_polygon: {source: collision_monitor/stop_polygon}
              collision_monitor_state: {source: collision_monitor_state}
              # CUBE coverage tiles -> CAMP live-tile view. Set up live 2026-06-29
              # via udp_bridge remote_advertise and confirmed working; persisted
              # here. coverage_tiles is request-driven (silent until CAMP asks).
              # Link budget (#389): one SonarVisualizationTile carries a dirty
              # sub-window of up to 960x960 INT16 cells = 1,843,200 B (~1.84 MB)
              # worst case, so a single busy tile exceeds the entire shared
              # 1,500,000 B/s VPN budget for over a second. period: 1.0 (was 0.5) trades panel latency
              # for uplink margin at the ROC (operator decision 2026-07-31); the
              # structural fix — bounding message size at the publisher — is
              # cube_bathymetry#112. Field check, next deployment: tiles arrive
              # WITHOUT a manual rate raise (ros2 topic bw .../coverage_tiles)
              # and 1 tile/s feels responsive enough at the operator station.
              # Do NOT lower period below 1.0 without raising the cap above or
              # landing the cube_bathymetry#112 message-size bound first.
              # NOTE: the inbound half (coverage_requests, CAMP->boat) is NOT here —
              # udp_bridge config only advertises OUTBOUND topics, so the sender
              # configures it: operator.yaml advertises coverage_requests -> bizzy
              # over vpn. These two files are a pair; edit them together.
              coverage_catalog: {source: sensors/m3/cube_bathymetry/coverage_catalog, queue_size: 2}
              coverage_tiles: {source: sensors/m3/cube_bathymetry/coverage_tiles, queue_size: 2, period: 1.0}
              # manda coverage-swath viz marker -> CAMP (enabled via display_topic in
              # nav2_overlay.yaml). Published per survey_area goal; rate-limited (the
              # LINE_STRIP grows with coverage). Set up live 2026-06-29.
              manda_coverage_swath: {source: manda_coverage/coverage_swath, queue_size: 2, period: 1.0}
              # Cropped local-costmap window for operator SA over the constrained VPN
              # link — throttled to 1 Hz (unh_marine_navigation#38, #127). The
              # footprint and path-follower viz are low-bandwidth, sent unthrottled.
              local_costmap_windowed: {source: local_costmap/costmap_windowed, period: 1.0}
              local_costmap_footprint: {source: local_costmap/published_footprint}
              path_follower_visualization: {source: path_follower_visualization}
              # Survey-line obstacle-avoidance overlay (unh_marine_navigation#30) —
              # intermittent + small, unthrottled like the path-follower viz above.
              survey_obstacle_avoidance: {source: survey_obstacle_avoidance}
              # Followed path for CAMP's platform path-line overlay (camp#55).
              # Republishes only on path change (stable on-line; bursts only while
              # avoiding), so unthrottled like the overlay it pairs with.
              received_global_plan: {source: received_global_plan}
              odom: {source: odom}
              oak_forward_ffmpeg: {source: sensors/cameras/oak_forward/image_raw/ffmpeg, queue_size: 5}
              oak_segmentation_forward:      {source: sensors/cameras/oak_forward/segmentation/compressed, queue_size: 2}
              oak_segmentation_forward_info: {source: sensors/cameras/oak_forward/segmentation/camera_info}
              oak_segmentation_forward_raw:    {source: sensors/cameras/oak_forward/segmentation, period: -1.0, queue_size: 2}
              oak_starboard_ffmpeg: {source: sensors/cameras/oak_starboard/image_raw/ffmpeg, queue_size: 5}
              oak_segmentation_starboard:      {source: sensors/cameras/oak_starboard/segmentation/compressed, queue_size: 2}
              # oak_segmentation_starboard_info / _raw not in VPN topics_list
              # (uplink budget — overlay only).
              # All 4 cameras' segmentation + ffmpeg on both links (full rate). Side
              # (port/stbd) ffmpeg re-enabled on VPN here (period: -1.0 removed) so they
              # match front/aft; VPN rate cap raised 20% to absorb it (#287, 2026-06-16).
              oak_aft_ffmpeg: {source: sensors/cameras/oak_aft/image_raw/ffmpeg, queue_size: 5}
              oak_segmentation_aft:      {source: sensors/cameras/oak_aft/segmentation/compressed, queue_size: 2}
              oak_port_ffmpeg: {source: sensors/cameras/oak_port/image_raw/ffmpeg, queue_size: 5}
              oak_segmentation_port:      {source: sensors/cameras/oak_port/segmentation/compressed, queue_size: 2}
              # oak_segmentation_port_info / _raw not in VPN topics_list
              # (uplink budget — overlay only).
              battery: {source: /bizzy/mavros/battery}
              plan: {source: plan}
              platforms: {source: /marine/platforms}
              mavros_gps_status: {source: mavros/gpsstatus/gps1/raw}
              mavros_orientation: {source: mavros/imu/data}
              mavros_position: {source: mavros/global_position/raw/fix}
              mavros_velocity: {source: mavros/global_position/raw/gps_vel}
              mavros_position_ekf: {source: mavros/global_position/global}
              mavros_velocity_body: {source: mavros/local_position/velocity_body}
              # rqt_boat_state operator panel (rqt_operator_tools#85): FCU mode,
              # actual/RC PWM, autonomy setpoint, and sound speed.
              mavros_state: {source: mavros/state}
              mavros_rc_out: {source: mavros/rc/out}
              mavros_rc_in: {source: mavros/rc/in}
              mavros_cmd_vel: {source: mavros/setpoint_velocity/cmd_vel}
              sound_speed: {source: sensors/sound_speed/sound_speed}
              tf: {source: /tf, queue_size: 25}
              tf_static: {source: /tf_static}
              # Sidescan port/stbd + water-column (down) imagery at full rate on
              # the VPN too — field-tested over the OTH link without issue
              # (2026-06-13). Nadir depth throttled to 1 Hz (operator readout
              # doesn't need the per-ping rate); temperature is already ~0.7 Hz;
              # both tiny.
              sidescan_port: {source: sensors/sidescan/garmin_sidescan/sonar_image_port, queue_size: 25}
              sidescan_starboard: {source: sensors/sidescan/garmin_sidescan/sonar_image_starboard, queue_size: 25}
              watercolumn_down: {source: sensors/sidescan/garmin_sidescan/sonar_image_down, queue_size: 25}
              sidescan_nadir_depth: {source: sensors/sidescan/garmin_sidescan/nadir_depth, period: 1.0}
              sidescan_water_temperature: {source: sensors/sidescan/garmin_sidescan/water_temperature}
              # USB camera on VPN at 0.5 Hz (2026-06-17 field tune, gabby): self-
              # contained JPEG frames, period 2.0 s, queue_size 1 (fail-fresh). Baked
              # from the in-session remote_advertise on the vpn connection — a low-rate
              # still feed for the operator within the constrained VPN byte budget.
              usb_camera: {source: sensors/cameras/usb/image_raw/compressed, period: 2.0, queue_size: 1}

          # Redundant cell-VPN downlink (#145): a thin always-on awareness channel
          # carried concurrently over the cell tunnel. Curated to the safety-
          # critical minimum — historically NO video / costmap / sidescan /
          # pointclouds; EXCEPT forward/port/starboard segmentation (compressed +
          # camera_info), added 2026-06-18 per operator request (see topics below;
          # ~48 KB/s of the 300 KB/s cap). The CAMP boat-monitoring topics (orientation / position /
          # velocity) match platform_sender's nav sources above, so CAMP can track
          # the boat over cell alone. tf left unthrottled per request; the byte cap
          # is provisional — raise if tf saturates it, tune down on-water.
          cell:
            maximum_bytes_per_second: 300000
            topics_list:
            - heartbeat
            - heartbeat_nav
            - mission_tasks
            - command_response
            - battery
            - collision_monitor_state
            - platforms
            - mavros_orientation
            - mavros_position_ekf
            - mavros_velocity_body
            - mavros_state
            - mavros_rc_out
            - mavros_rc_in
            - mavros_cmd_vel
            - sound_speed
            - sidescan_water_temperature
            - mavros_gps_status
            - tf
            - tf_static
            - local_costmap_footprint
            # Segmentation on cell (added 2026-06-18 per operator request; overrides
            # the "no video" note above). Mirrors the VPN segmentation routing.
            - oak_segmentation_forward
            - oak_segmentation_forward_info
            - oak_segmentation_port
            - oak_segmentation_port_info
            - oak_segmentation_starboard
            - oak_segmentation_starboard_info
            topics:
              heartbeat: {source: marine/heartbeat}
              heartbeat_nav: {source: marine/status/mission_manager}
              # Structured running-task state for CAMP's task view (camp#123).
              # Sibling of heartbeat_nav; same full-rate cadence (the boat
              # publishes it periodically). Carries task poses, so it can be
              # larger than the flattened heartbeat over cell — tune cadence
              # after measuring the link budget, not blind (PR#239 review).
              mission_tasks: {source: marine/status/mission_tasks}
              command_response: {source: marine/response}
              battery: {source: /bizzy/mavros/battery}
              collision_monitor_state: {source: collision_monitor_state}
              platforms: {source: /marine/platforms}
              mavros_orientation: {source: mavros/imu/data}
              mavros_position_ekf: {source: mavros/global_position/global}
              mavros_velocity_body: {source: mavros/local_position/velocity_body}
              # rqt_boat_state operator panel (rqt_operator_tools#85): FCU mode,
              # actual/RC PWM, autonomy setpoint, and sound speed.
              mavros_state: {source: mavros/state}
              mavros_rc_out: {source: mavros/rc/out}
              mavros_rc_in: {source: mavros/rc/in}
              mavros_cmd_vel: {source: mavros/setpoint_velocity/cmd_vel}
              sound_speed: {source: sensors/sound_speed/sound_speed}
              # Garmin transducer water temperature — tiny scalar, carried on the thin
              # cell channel too (already on wifi/vpn). Pairs with sound_speed above.
              sidescan_water_temperature: {source: sensors/sidescan/garmin_sidescan/water_temperature}
              mavros_gps_status: {source: mavros/gpsstatus/gps1/raw}
              tf: {source: /tf, queue_size: 25}
              tf_static: {source: /tf_static}
              local_costmap_footprint: {source: local_costmap/published_footprint}
              # Segmentation on cell (added 2026-06-18, see topics_list note). Compressed
              # at queue_size 2 (matches VPN); camera_info bare. Full rate (no period).
              oak_segmentation_forward:        {source: sensors/cameras/oak_forward/segmentation/compressed, queue_size: 2}
              oak_segmentation_forward_info:   {source: sensors/cameras/oak_forward/segmentation/camera_info}
              oak_segmentation_port:           {source: sensors/cameras/oak_port/segmentation/compressed, queue_size: 2}
              oak_segmentation_port_info:      {source: sensors/cameras/oak_port/segmentation/camera_info}
              oak_segmentation_starboard:      {source: sensors/cameras/oak_starboard/segmentation/compressed, queue_size: 2}
              oak_segmentation_starboard_info: {source: sensors/cameras/oak_starboard/segmentation/camera_info}

/**/logger:
  ros__parameters:
    record:
      all_topics: false
      topics:
      - /diagnostics
      - /bizzy/mavros/battery
      - /bizzy/mavros/global_position/global
      - /bizzy/mavros/global_position/raw/fix
      - /bizzy/mavros/global_position/raw/gps_vel
      - /bizzy/mavros/gpsstatus/gps1/raw
      - /bizzy/mavros/imu/data
      - /bizzy/mavros/state
      - /bizzy/mavros/gps_rtk/send_rtcm
      # RTK + NTRIP state, added 2026-08-20 to back the new RTK and NTRIP
      # annunciators. Motivated by that day's finding: the FCU sat in
      # RTK_FLOAT for ~45 minutes (17:20-18:05 EDT) with vertical accuracy
      # degrading to 1.75 m, putting ~1 m of error into the nav solution and
      # therefore into the tide. gpsstatus/gps1/raw already recorded the
      # fix_type that revealed it after the fact, but nothing captured WHY —
      # whether corrections were arriving at all. These do.
      #
      # The annunciators themselves read /diagnostics (already recorded, and
      # carrying the "GPS: RTK" and "NTRIP" entries they display), so this is
      # about the underlying evidence, not the indicator state.
      #
      # All are low volume: ntrip/fix ~1 Hz, the rest event-driven and idle
      # most of the time. gps2 is omitted deliberately — GPS_TYPE2 is 0 on
      # this boat, so there is no second receiver to report.
      - /bizzy/mavros/gpsstatus/gps1/rtk
      - /bizzy/mavros/gps_rtk/rtk_baseline
      - /bizzy/sensors/ntrip/fix
      - /bizzy/sensors/ntrip/nmea
      # Which navigation source mru_transform is actually using. Publishes at
      # the position rate (10 Hz) on every update, not just on change. NOT
      # previously recorded, which on 2026-08-20 meant a suspected FCU/SBG
      # failover had to be disproved indirectly by correlating /bizzy/odom
      # against both receivers' raw fixes across 3.6 GB of bag. With this
      # topic the same question is a one-line answer. Tiny: a short string.
      - /bizzy/nav/active_sensor/position
      - /bizzy/nav/active_sensor/orientation
      - /bizzy/nav/active_sensor/velocity
      # FCU control effort — see what the autopilot is actually commanding
      # to the thrusters/servos (rc/out) and how hard its internal nav
      # controller is working to follow cmd_vel (nav_controller_output).
      - /bizzy/mavros/rc/out
      - /bizzy/mavros/nav_controller_output
      # FCU EKF3-fused nav at CG (mavros local_position plugin). These
      # are the FCU-side counterparts to SBG's ekf_nav / ekf_quat /
      # imu_data so SBG-vs-FCU comparison at base_link is reproducible
      # from the bag. velocity_body was the mru_transform velocity
      # input under the 2026-04-28 config; the 2026-05-19 field revert
      # restored raw/gps_vel (see mru_transform block above). Durable
      # nav-input choice tracked in #138 (FCU reconfig).
      - /bizzy/mavros/local_position/odom
      - /bizzy/mavros/local_position/pose
      - /bizzy/mavros/local_position/velocity_local
      - /bizzy/mavros/local_position/velocity_body
      - /bizzy/mavros/local_position/accel
      - /bizzy/odom
      - /bizzy/tide_estimate
      - /bizzy/mllw_offset
      - /bizzy/mhhw_offset
      - /bizzy/marine/heartbeat
      - /bizzy/marine/status/mission_manager
      - /bizzy/marine/status/mission_tasks
      # AIS, added 2026-08-24 (field). Nothing AIS was recorded before this,
      # even though ais_layer has been painting surface traffic into both
      # costmaps since 2026-08-20 -- so an AIS-driven avoidance manoeuvre could
      # not be reconstructed from a bag at all. Logged rawest-first, matching
      # the sonar_logger's detections rationale: nmea is the wire text and lets
      # messages/contacts be re-derived offline, while contacts is what
      # ais_layer actually consumes and is the thing to replay when asking why
      # the costmap looked the way it did.
      - /bizzy/ais/nmea
      - /bizzy/ais/messages
      - /bizzy/ais/contacts
      - /bizzy/ais/atons
      - /bizzy/robot_description
      - /bizzy/sensors/cameras/oak_forward/rgb/camera_info
      - /bizzy/sensors/cameras/oak_forward/rgb/image_raw/compressed
      - /bizzy/sensors/cameras/oak_starboard/rgb/camera_info
      - /bizzy/sensors/cameras/oak_starboard/rgb/image_raw/compressed
      - /bizzy/sensors/cameras/oak_aft/rgb/camera_info
      - /bizzy/sensors/cameras/oak_aft/rgb/image_raw/compressed
      - /bizzy/sensors/cameras/oak_port/rgb/camera_info
      - /bizzy/sensors/cameras/oak_port/rgb/image_raw/compressed
      # SBG Ellipse-D INS — standard ROS messages (REP-103, use_enu:true),
      # grouped under sbg/imu/ via sbg_launch remaps (#339). These replace
      # the proprietary sbg/* dumps: imu/data carries EKF attitude + raw
      # gyro/accel (was ekf_quat + imu_data), nav_sat_fix the ellipsoidal
      # fix (was gps_pos / ekf_nav), velocity the ENU velocity (was gps_vel).
      - /bizzy/sensors/sbg/imu/data
      - /bizzy/sensors/sbg/imu/nav_sat_fix
      - /bizzy/sensors/sbg/imu/velocity
      - /bizzy/sensors/sbg/imu/mag
      - /bizzy/sensors/sbg/imu/temp
      - /bizzy/sensors/sbg/imu/pos_ecef
      - /bizzy/sensors/sbg/imu/utc_ref
      # SBG solution/health status retained — proprietary, but it has NO
      # standard equivalent (RTK fix type, EKF solution mode, aiding status).
      # Diagnostic for SBG-as-primary nav. Drop if strict standard-only.
      - /bizzy/sensors/sbg/status
      # AML SVS sound-speed probe. Out-of-water → 0.0 m/s with the
      # current `regex` parser (probe firmware emits literal `0.000` when
      # the head is dry; the regex matches it). Parse failures → NaN.
      # See unh_echoboats_project11#104 wrap-up + marine_tools#7.
      - /bizzy/sensors/sound_speed/sound_speed
      # Raw AML sentence passthrough — byte-exact serial frames, including
      # sentences the parser rejects, for field sound-speed RCA from the bag
      # alone (#396). One message per FRAMED line only; framing is `\r\n`
      # here because sound_speed_launch.py sets `regex_line_terminator:
      # 'crlf'` — the parser's own default (and `parser: 'aml'`) frames on a
      # bare `\r`. Unframed byte streams (wrong baud, the all-NUL fault of
      # #163) produce NO messages here (see marine_tools#77, byte-stream tap).
      # Reading it:
      #   MISSING from the bag → (a) this recorder config is stale on gabby:
      #     bizzyboat_project11 needs its own pull+REBUILD, independent of the
      #     driver (ament copies config/; symlink-install does not propagate
      #     it), (b) the driver build predates the `raw` publisher
      #     (marine_tools#75 / PR#76, merged 2026-07-29), or (c) the bridge
      #     was not running. Rebuild BOTH packages together on gabby — the
      #     driver-only order makes the topic live but unrecorded.
      #   PRESENT with zero messages → probe silent, output not framed as
      #     expected (the #163 fault), or a host-side serial fault (wrong /
      #     missing device, permissions): publishers are created before the
      #     serial thread connects, and it retries forever. Discriminate with
      #     /diagnostics in this same bag — the node logs
      #     "Serial not connected (<device>)" at ERROR.
      #   PRESENT with messages but parsed .../sound_speed is NaN → the probe
      #     is framing sentences the `regex_pattern` rejects.
      # Diagnostic-only: deliberately NOT recorded in sonar_logger.
      - /bizzy/sensors/sound_speed/raw
      # Garmin transducer water temperature + nadir bottom range — small scalars,
      # kept in the main bag (alongside sound_speed) so the sound-speed/depth
      # cross-check is self-contained here, not only in the sonar bag (#270;
      # follow-up to #257 which only added these to sonar_logger + the bridge).
      - /bizzy/sensors/sidescan/garmin_sidescan/water_temperature
      - /bizzy/sensors/sidescan/garmin_sidescan/nadir_depth
      - /bizzy/udp_bridge/bridge_info
      - /bizzy/udp_bridge/topic_statistics
      - /bizzy/udp_bridge/remotes/operator/bridge_info
      - /bizzy/udp_bridge/remotes/operator/topic_statistics
      - /bizzy/cmd_vel_nav
      - /bizzy/cmd_vel_smoothed
      - /bizzy/piloting_mode/autonomous/cmd_vel
      - /bizzy/mavros/setpoint_velocity/cmd_vel
      # Nav2 / BT action status and planning (issue #58)
      - /bizzy/run_tasks/_action/status
      - /bizzy/run_tasks/_action/send_goal
      - /bizzy/compute_path_through_poses/_action/status
      - /bizzy/follow_path/_action/status
      # CrabbingPathFollower PID internals — cross-track error (error),
      # p/i/d terms, crab command (output); type control_msgs/PidState.
      # Record-only for post-mission XTE analysis of SE-line undulation
      # (#164). Topic verified live on gabby 2026-05-26: resolves under
      # /bizzy/ (the node is namespaced), NOT the global /FollowPath/...
      # the topic_prefix alone would suggest — confirm before assuming.
      - /bizzy/FollowPath/pid/pid_state
      - /bizzy/hover/_action/status
      - /bizzy/plan
      - /bizzy/path_follower_visualization
      - /bizzy/hover_visualization
      - /bizzy/behavior_tree_log
      - /bizzy/collision_monitor_state
      # Reflex collision-avoidance cloud (perception#17 adapter) — Collision Monitor source (#170)
      - /bizzy/collision_monitor/pointcloud
      # Collision Monitor danger-zone polygons (visualize: true) — capture the
      # slowdown/stop zone geometry so non-trigger events can be replayed
      # against the cloud directly, without re-deriving zones from config + TF
      # (#170; geometry_msgs/PolygonStamped).
      - /bizzy/collision_monitor/slowdown_polygon
      - /bizzy/collision_monitor/stop_polygon
      - /bizzy/local_costmap/published_footprint
      - /bizzy/marine/response
      # Operator command INPUTS — record the raw command bus + manual helm
      # boat-side so the boat bag is self-contained for "what was commanded,
      # by whom, when" (incl. manual takeovers). Previously these lived only
      # in the operator-station bag; the #205 wrap-up needed that bag to
      # confirm command intent + takeover timing (#209). Both low-rate.
      - /bizzy/marine/command
      - /bizzy/piloting_mode/manual/helm
      # Trackline geometry + mission-manager command stream. The boat
      # already logs the helm command bus (/marine/command) and mission
      # *status* (/marine/status/mission_manager), but NOT the mission_plan
      # itself (the trackline geometry sent from the operator) nor the
      # mission_manager command stream (execute/clear/next). Without these
      # the bag can't answer "what trackline was sent" vs "where the boat
      # went". Added to debug the recurring "new trackline executed → boat
      # heads off in the wrong direction; clear + resend recovers" event
      # (2026-06-23 gabby; operator recalled a prior occurrence). Both
      # std_msgs/String, low-rate, verified live on gabby 2026-06-23.
      - /bizzy/marine/mission_plan
      - /bizzy/marine/mission_manager/command
      - /marine/platforms
      # Runtime parameter changes (#419): without these, live param edits
      # (e.g. the 2026-08-04 aft-camera image_mask_rects adjustment) are
      # unrecoverable from bags — "was it ever set?" was unanswerable at
      # that wrap-up. Namespaced nodes publish under /bizzy; record both.
      # Event-driven and tiny.
      - /parameter_events
      - /bizzy/parameter_events
      - /rosout
      - /tf
      - /tf_static
    storage:
      uri: /home/field/data/logs/bizzyboat
      max_bagfile_duration: 300
      storage_preset_profile: zstd_fast

/**/sonar_logger:
  ros__parameters:
    record:
      all_topics: false
      topics:
      - /diagnostics
      - /bizzy/odom
      - /bizzy/robot_description
      # - /bizzy/sensors/deltat/soundings   # temporarily dead (DeltaT not
      #   installed) — records nothing; commented out, re-enable when it returns.
      # M3 multibeam: detections are the first/rawest ROS product
      # (kongsberg_em_bridge -> detections -> soundings -> CUBE grid).
      # Logging detections lets soundings + grid be re-derived offline by
      # replaying through the pipeline.
      - /bizzy/sensors/m3/detections
      # Latched SonarInfo acquisition metadata (ADR-0009, marine_tools#69):
      # pulse length / bandwidth / signal type per TX sector -- the GeoCoder
      # ensonified-area inputs -- plus what the detections intensities mean.
      # Republished on change and on a 10 s heartbeat, well inside this bag's
      # 300 s splits, so every segment carries at least one (#375).
      - /bizzy/sensors/m3/sonar_info
      # Garmin GCV-20 sidescan (on by default; absent if core_launch sidescan:=false).
      # Decoded per-channel imagery + latched control/status. debug/raw_status
      # carries the GCV :50050 status stream (incl. the unverified depth field)
      # and debug/raw_config the chartplotter :51000 CDP config (the active range
      # under auto-range); both are only published when the driver runs with
      # debug_raw:=true and the mercat proxy relays :50050/:51000 (marine_tools#28),
      # recorded here so the first wet run captures them for the offline
      # depth + range/sample-rate decode.
      - /bizzy/sensors/sidescan/garmin_sidescan/sonar_image_port
      - /bizzy/sensors/sidescan/garmin_sidescan/sonar_image_starboard
      - /bizzy/sensors/sidescan/garmin_sidescan/sonar_image_down
      # Per-ping nadir bottom range (sub-header v1, marine_tools#36) and
      # transducer surface water temperature (d807 telemetry, marine_tools#38) —
      # small scalars kept with the imagery for post-processing (depth ground
      # truth + a sound-speed/temperature cross-check).
      - /bizzy/sensors/sidescan/garmin_sidescan/nadir_depth
      - /bizzy/sensors/sidescan/garmin_sidescan/water_temperature
      - /bizzy/sensors/sidescan/garmin_sidescan/state
      - /bizzy/sensors/sidescan/garmin_sidescan/status
      - /bizzy/sensors/sidescan/garmin_sidescan/debug/raw_status
      - /bizzy/sensors/sidescan/garmin_sidescan/debug/raw_config
      # Sound-speed for bathy correction in post-processing. The raw sentence
      # passthrough (.../sound_speed/raw) is deliberately main-bag-only — it is
      # a diagnostic artifact, not an input to the bathy correction (#396).
      - /bizzy/sensors/sound_speed/sound_speed
      # SBG INS streams dropped (#339): sonar motion-comp / georeferencing
      # comes from TF below (base_link attitude via mru_transform), and the
      # raw SBG topics are in the main bag if needed for offline review.
      - /tf
      - /tf_static
    storage:
      uri: /home/field/project11/data/bizzyboat_sonar
      max_bagfile_duration: 300
      storage_preset_profile: zstd_fast

/**/chart_datum:
  ros__parameters:
    map_frame: bizzy/map
    chart_datum_frame: bizzy/chart_datum
    base_frame: bizzy/base_link
    mhhw_frame: bizzy/chart_datum_mhhw
    # Lake Massabesic datum comes from the polygon config (override:true entry,
    # chart_datum_z = 48.88 m full-pool WGS84 ellipsoidal) in
    # config/massabesic_datum_polygons.yaml, wired via datum_config_path in
    # core_launch.py. No scalar lake_datum here, so the polygon is the live
    # source (single source of truth, toward unh_marine_autonomy#163). Datum
    # derivation: #278.

/**/sea_surface_estimator:
  ros__parameters:
    sea_surface_frame: bizzy/map_tide
    # The estimator averages odom Z, which is the height of base_link, not of
    # the water. bizzy/waterline is 0.030 m above base_link (measured
    # 2026-06-15 at Lake Massabesic: draft reference +0.180, water line 0.150
    # below that). Without this the published tide is low by that offset --
    # the node's original TODO, unaddressed from 2025-05-05 until 2026-08-21.
    # NOTE the 0.030 m is a FRESHWATER figure and predates later payload
    # changes; salt water alone raises the hull ~5 mm. Re-measure at the pier.
    #
    # CROSS-REPO DEPENDENCY: water_line_frame only exists in mru_transform's
    # sea_surface_estimator from 58b7f97 (2026-08-21) onward. Setting a
    # parameter a node does not declare is a SILENT NO-OP -- rclcpp drops it,
    # the node starts normally, and the tide simply stays low by this offset.
    # There is no startup failure to notice, so an mru_transform install older
    # than that commit reverts the correction without any signal. Verify after
    # a rebuild:
    #   ros2 param get /bizzy/sea_surface_estimator water_line_frame
    water_line_frame: bizzy/waterline
    chart_datum_frame: bizzy/chart_datum
    mhhw_frame: bizzy/chart_datum_mhhw

/**/mikrotik_monitor:
  ros__parameters:
    host: 'wifi.bizzy.p11.lan'
    username: 'ros_monitor'
    password: 'ros_monitor'
    port: 80
    use_ssl: false
    poll_interval: 5.0
    hardware_id: 'wifi.bizzy'

/**/teltonika_monitor:
  ros__parameters:
