# Pre-commit configuration for unh_echoboats_project11.
# Based on the workspace template (ros2_agent_workspace
# .agent/templates/pre-commit-config.yaml); see ADR-0004/0005 there for the
# enforcement hierarchy rationale.
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # allow ROS YAML tags
      - id: check-xml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-lint
        args: ['--disabled-codes', 'C0103,C0113,C0301']
        # C0103: invalid-name (ROS packages use unconventional names)
        # C0113: missing-command (ament macros not recognized)
        # C0301: line-too-long

  # black/flake8 stay off for now: the repo's Python (launch files, field
  # scripts, the retrofit utility) predates the hooks and a blanket reformat
  # is too invasive for onboarding — enablement rides with the license-header
  # cleanup issue.

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: default, rules: {line-length: {max: 120}, document-start: disable, truthy: disable}}']

  # no-commit-to-branch is intentionally DISABLED on this field-mode clone.
  # This repo's origin is gitcloud (non-GitHub), so it operates in field mode
  # (ros2_agent_workspace AGENTS.md "Field Mode"), where deployment logs and
  # hotfixes are committed directly to the default branch (jazzy) — there is no
  # PR flow on the field remote. The guard blocked that (the "hook caveat" in
  # AGENTS.md). Disabled 2026-07-29 to unblock field-side deployment logging.
  #
  # KEEP THIS GUARD ON GitHub-origin (dev) clones: there, branch protection +
  # the PR workflow apply, and the redundant local block is useful because
  # agents forget not to commit to the default branch. Restore on the dev side.
  # - repo: https://github.com/pre-commit/pre-commit-hooks
  #   rev: v4.6.0
  #   hooks:
  #     - id: no-commit-to-branch
  #       args: ['--branch', 'jazzy']
